name: check

# Types and the build, on every push and pull request.
#
# Deliberately not the probes. They write real rows to the real database —
# there is one, and it holds real volunteers — so running them from CI would
# mean every pull request touching the association's data. They stay a
# deliberate act: `npm run probe`, by someone who knows what it is doing.
#
# If a second database is ever provisioned (Neon can branch one), add a job
# here that points DATABASE_URL at the branch and runs `npm run probe` there.

# Every branch, not just main.
#
# This was restricted to main to stop a branch with an open pull request
# running the same commit twice. It worked, and it also meant nothing checked
# the branch where the work actually happens. A commit that imported two
# packages without adding them to package.json sat on the working branch for a
# day: it built locally, because the packages were sitting in node_modules, and
# `npm ci` on a clean machine could not resolve them. Vercel failed every
# deploy that whole time and the live site quietly stayed on an old commit.
#
# The duplicate run is the real problem but the cheap one. The concurrency
# group below cancels the older run for a ref, so a push and its pull_request
# collapse into one, and a second push cancels the first.
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Before the build, because it names the mistake in a second where the
      # build takes two minutes to report it as a module-resolution error.
      - name: Every import is declared
        run: node scripts/undeclared-imports.mjs

      # The build has to come first.
      #
      # next build generates the typed-route definitions - PageProps and the
      # route union - that every page file references. On a fresh checkout
      # there is no .next, so a typecheck run before the build fails with
      # "Cannot find name 'PageProps'" in every page. It passes on a developer
      # machine only because .next is already lying around from last time,
      # which is exactly the difference CI exists to catch. It caught it.
      - name: Build
        run: npm run build

      - name: Types (application)
        run: npx tsc --noEmit

      - name: Types (scripts)
        run: npx tsc -p scripts --noEmit

      # Arabic mangled by a careless find-and-replace has reached a commit
      # twice. It is cheap to refuse a third time.
      - name: No mojibake
        run: |
          if grep -rlP '(Ã˜|Ã™|â€|Ã‚|Ù„Ø|âœ|â˜)' \
               --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.sql' \
               src scripts migrations; then
            echo "Mojibake found — a non-ASCII string was corrupted. See the files above."
            exit 1
          fi
